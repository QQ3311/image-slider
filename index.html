<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Слайдер изображений</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="slider" aria-label="Слайдер изображений">
      <h1 class="slider__title">Галерея</h1>

      <div class="slider__viewport">
        <img
          class="slider__image"
          id="sliderImage"
          src="images/1.jpg"
          alt="Вест-хайленд-уайт-терьер"
        >
      </div>

      <p class="slider__counter" id="sliderCounter" aria-live="polite">
        Изображение 1 из 5
      </p>

      <div class="slider__controls">
        <button class="slider__btn slider__btn--prev" id="sliderPrevBtn" type="button">
          <span aria-hidden="true">←</span> Назад
        </button>
        <button class="slider__btn slider__btn--next" id="sliderNextBtn" type="button">
          Вперёд <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
